<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>_test-fxchain stylize</title>
<style>html,body{margin:0;background:#000;overflow:hidden} canvas{display:block}</style></head>
<body><canvas id="stage"></canvas>
<script type="module">
// 多 pass + 风格化验收：同一张 2D 源画面（360×480，每帧按 t 重画后上传）过 12 种效果，各写一个命名目标，
// 最后一个 mosaic pass 把 12 个目标拼成 3×4 宫格上屏。全部在一个 WebGL2 context 里，不经 2D 中转。
//   行 1：半调 / 有序抖动+调色板 / 像素化        行 2：Sobel 描边 / Kuwahara / ASCII
//   行 3：镜头畸变+色散 / lift-gamma-gain / 3D LUT（.cube 文本解析）
//   行 4：泛光（提取→降采样→分离高斯→合成）/ halation / 变形镜头横向拉丝
// 所有取值只是这支验收片的数，不是推荐。
import { makeLayout } from './runtime/layout.js';
import { createChain, HEADER, parseCube } from './runtime/fxchain.js';
import { GLSL } from './runtime/webfx.js';
import { STYLIZE } from './runtime/fxglsl.js';

const L = makeLayout(new URLSearchParams(location.search).get('format') || '9x16');
const DURATION = 6;
window.DURATION = DURATION;
const FPS = 30, TAU = Math.PI * 2;
const stage = document.getElementById('stage');
stage.width = L.width; stage.height = L.height;
const ctx = stage.getContext('2d', { alpha: false });

// 源画面：渐变底 + 发光圆 + 1px/2px 细线 + 小方块
const CW = Math.round(L.width / 3), CH = Math.round(L.height / 4);
const src = document.createElement('canvas'); src.width = CW; src.height = CH;
const sx = src.getContext('2d');
function paint(t) {
  const g = sx.createLinearGradient(0, 0, 0, CH);
  g.addColorStop(0, '#1b2a4a'); g.addColorStop(0.55, '#c9744a'); g.addColorStop(1, '#f3e1b8');
  sx.fillStyle = g; sx.fillRect(0, 0, CW, CH);
  for (let i = 0; i < 4; i++) {
    const a = TAU * (t / DURATION + i / 4);
    const x = CW * (0.5 + 0.3 * Math.cos(a)), y = CH * (0.35 + 0.18 * Math.sin(a));
    sx.fillStyle = i % 2 ? '#fffbe8' : '#4fd0ff';
    sx.beginPath(); sx.arc(x, y, CW * (0.05 + 0.02 * i), 0, TAU); sx.fill();
  }
  sx.strokeStyle = '#101418';
  for (let i = 0; i < 6; i++) {
    sx.lineWidth = i < 3 ? 1 : 2;
    const y = CH * 0.62 + i * 9;
    sx.beginPath(); sx.moveTo(CW * 0.08, y); sx.lineTo(CW * 0.92, y + 14 * Math.sin(TAU * t / DURATION)); sx.stroke();
  }
  for (let i = 0; i < 8; i++) { sx.fillStyle = `hsl(${i * 45},70%,${30 + 5 * i}%)`; sx.fillRect(CW * 0.08 + i * CW * 0.105, CH * 0.86, CW * 0.08, CH * 0.08); }
}

// 一个程序化的 .cube（17³，压暗部偏青、亮部偏暖），走 parseCube 解析
const N = 17; let cubeText = 'TITLE "fixture"\nLUT_3D_SIZE 17\nDOMAIN_MIN 0 0 0\nDOMAIN_MAX 1 1 1\n';
for (let b = 0; b < N; b++) for (let g = 0; g < N; g++) for (let r = 0; r < N; r++) {
  const R = r / (N - 1), G = g / (N - 1), B = b / (N - 1), l = 0.3 * R + 0.6 * G + 0.1 * B;
  const s = (x) => x * x * (3 - 2 * x);
  cubeText += `${s(R) * 0.9 + 0.1 * l} ${s(G)} ${Math.min(1, s(B) * 0.8 + 0.25 * (1 - l))}\n`;
}

const H = HEADER, LIB = HEADER + GLSL.hash;
const cell = [1 / 3, 1 / 4];
const P = (name, frag, ins, extra = {}) => ({ name, out: name, scale: cell, frag, in: ins, ...extra });
const passes = [
  P('halftone', H + STYLIZE.halftone, { u_src: 'src' }),
  P('dither', LIB + STYLIZE.dither, { u_src: 'src' }),
  P('pixelate', H + STYLIZE.pixelate, { u_src: 'src' }),
  P('outline', H + STYLIZE.outline, { u_src: 'src' }),
  P('kuwahara', H + '#define KMAX 4\n' + STYLIZE.kuwahara, { u_src: 'src' }),
  P('ascii', H + STYLIZE.ascii, { u_src: 'src' }),
  P('lens', H + STYLIZE.lens, { u_src: 'src' }),
  P('lgg', H + STYLIZE.grade_lgg, { u_src: 'src' }),
  P('lut', H + STYLIZE.lut3d, { u_src: 'src', u_lut: 'cube' }),
  // 泛光：提取(1/2) → 降采样(1/4) → 横 → 竖 → 合成
  { name: 'b_ex', out: 'b_ex', scale: [1 / 6, 1 / 8], format: 'rgba16f', frag: H + STYLIZE.extract, in: { u_src: 'src' } },
  { name: 'b_dn', out: 'b_dn', scale: [1 / 12, 1 / 16], format: 'rgba16f', frag: H + STYLIZE.down4, in: { u_src: 'b_ex' } },
  { name: 'b_h', out: 'b_h', scale: [1 / 12, 1 / 16], format: 'rgba16f', frag: H + STYLIZE.blur9, in: { u_src: 'b_dn' }, uniforms: { u_dir: [1.5, 0] } },
  { name: 'b_v', out: 'b_v', scale: [1 / 12, 1 / 16], format: 'rgba16f', frag: H + STYLIZE.blur9, in: { u_src: 'b_h' }, uniforms: { u_dir: [0, 1.5] } },
  P('bloom', H + STYLIZE.glow_mix, { u_src: 'src', u_glow: 'b_v', u_mask: 'b_ex' }),
  // halation：同一套提取，模糊半径小、单色、偏红、扣掉亮部本身
  { name: 'h_h', out: 'h_h', scale: [1 / 6, 1 / 8], format: 'rgba16f', frag: H + STYLIZE.blur9, in: { u_src: 'b_ex' }, uniforms: { u_dir: [1, 0] } },
  { name: 'h_v', out: 'h_v', scale: [1 / 6, 1 / 8], format: 'rgba16f', frag: H + STYLIZE.blur9, in: { u_src: 'h_h' }, uniforms: { u_dir: [0, 1] } },
  P('halation', H + STYLIZE.glow_mix, { u_src: 'src', u_glow: 'h_v', u_mask: 'b_ex' }),
  // 变形镜头拉丝：提取到一张很扁的目标（横 1/2、竖 1/8 的格子），只横向模糊三遍、步长 1 → 3 → 9
  { name: 's_ex', out: 's_ex', scale: [1 / 6, 1 / 32], format: 'rgba16f', frag: H + STYLIZE.extract, in: { u_src: 'src' } },
  { name: 's_1', out: 's_1', scale: [1 / 6, 1 / 32], format: 'rgba16f', frag: H + STYLIZE.blur9, in: { u_src: 's_ex' }, uniforms: { u_dir: [1, 0] } },
  { name: 's_2', out: 's_2', scale: [1 / 6, 1 / 32], format: 'rgba16f', frag: H + STYLIZE.blur9, in: { u_src: 's_1' }, uniforms: { u_dir: [3, 0] } },
  { name: 's_3', out: 's_3', scale: [1 / 6, 1 / 32], format: 'rgba16f', frag: H + STYLIZE.blur9, in: { u_src: 's_2' }, uniforms: { u_dir: [9, 0] } },
  P('streak', H + STYLIZE.glow_mix, { u_src: 'src', u_glow: 's_3', u_mask: 's_ex' }),
];
const GRID = ['halftone', 'dither', 'pixelate', 'outline', 'kuwahara', 'ascii', 'lens', 'lgg', 'lut', 'bloom', 'halation', 'streak'];
const mosaicIn = Object.fromEntries(GRID.map((n, i) => [`u_c${i}`, n]));
passes.push({
  name: 'mosaic', out: 'screen', in: mosaicIn,
  frag: H + GRID.map((_, i) => `uniform sampler2D u_c${i};`).join('\n') + `
void main(){
  vec2 g = vec2(v_uv.x * 3.0, (1.0 - v_uv.y) * 4.0);   // 第 0 行在上
  vec2 c = floor(g); vec2 f = vec2(fract(g.x), 1.0 - fract(g.y));
  float i = c.y * 3.0 + c.x; vec4 o;
  ${GRID.map((_, i) => `${i ? 'else ' : ''}if (i < ${i}.5) o = TEX(u_c${i}, f);`).join('\n  ')}
  else o = vec4(0.0);
  vec2 e = min(fract(g), 1.0 - fract(g)) * u_res / vec2(3.0, 4.0);
  OUT = (min(e.x, e.y) < 2.0) ? vec4(0.0, 0.0, 0.0, 1.0) : o;   // 2px 黑缝
}` });

const chain = createChain({ width: L.width, height: L.height, seed: 5, passes });
chain.lut('cube', parseCube(cubeText));

const PAL = [[0.07, 0.07, 0.1], [0.36, 0.2, 0.32], [0.8, 0.42, 0.3], [0.97, 0.88, 0.66], [0.3, 0.6, 0.75], [0, 0, 0], [0, 0, 0], [0, 0, 0]];
window.seek = (t) => {
  paint(t);
  chain.texture('src', src);   // 每帧重画、每帧上传（没声明 static）
  const frame = Math.round(t * FPS);
  chain.render(t, {
    halftone: { u_cell: 9, u_angle: 0.26, u_soft: 0.8, u_ink: [0.1, 0.08, 0.12], u_paper: [0.96, 0.93, 0.86], u_color: 0 },
    dither: { u_pixel: 3, u_spread: 0.35, u_noise: 0.15, u_frame: frame, u_pal: PAL, u_npal: 5 },
    pixelate: { u_cell: 12, u_origin: [0, 0], u_avg: 1 },
    outline: { u_width: 1, u_thresh: 0.12, u_soft: 0.2, u_line: [0.08, 0.08, 0.1], u_paper: [0.95, 0.94, 0.9], u_keep: 0 },
    kuwahara: { u_radius: 4 },
    ascii: { u_cell: 12, u_ink: [0.55, 1.0, 0.6], u_paper: [0.02, 0.04, 0.03], u_color: 0 },
    lens: { u_k1: 0.35 + 0.15 * Math.sin(TAU * t / DURATION), u_k2: 0.05, u_zoom: 1.15, u_disp: 0.012, u_edge: [0, 0, 0, 1] },
    lgg: { u_lift: [0.02, 0.04, 0.08], u_gamma: [1.1, 1.0, 0.9], u_gain: [1.05, 0.98, 0.9], u_exposure: 0, u_sat: 0.8 },
    lut: { u_mix: 1 },
    b_ex: { u_thresh: 0.8, u_knee: 0.15 }, s_ex: { u_thresh: 0.85, u_knee: 0.1 },
    bloom: { u_tint: [1, 1, 1], u_amount: 1.2, u_ring: 0, u_mono: 0 },
    halation: { u_tint: [1, 0.25, 0.08], u_amount: 1.6, u_ring: 0.9, u_mono: 1 },
    streak: { u_tint: [0.5, 0.75, 1.0], u_amount: 2.0, u_ring: 0, u_mono: 1 },
  });
  chain.drawTo(ctx);
};
window.__chain = chain;
</script></body></html>
