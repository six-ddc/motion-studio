<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden}canvas{display:block}</style>
<canvas id="stage"></canvas>
<script type="module">
// kit 夹具：首尾帧 = kit demo 的标准帧，中间一个方块横移。
import { std } from './runtime/kits/demo/paint.js';
const W = 1920, H = 1080;
const cv = document.getElementById('stage'); cv.width = W; cv.height = H;
const c = cv.getContext('2d');
window.DURATION = 1;
window.seek = (t) => {
  std(c, W, H);
  const u = Math.sin(Math.PI * Math.min(1, Math.max(0, t / window.DURATION)));   // 两端为 0：首尾帧回到标准帧
  if (u > 1e-9) { c.fillStyle = '#FFF4EC'; c.fillRect(200 + 1400 * u, 100, 80, 80); }
  if (t === 0) { c.fillStyle = '#141926'; c.fillRect(10, 10, 4, 4); }   // 标准帧上多画了一笔（肉眼看不出的 4×4、差 1 个色阶）
};
window.ready = Promise.resolve();
</script>
