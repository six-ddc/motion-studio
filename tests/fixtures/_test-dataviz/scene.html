<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<canvas id="stage"></canvas>
<script type="module">
// chart.js 夹具：四格，只画几何（不画字，字体来源门与本夹具无关）。
// 左上 柱状图竞赛 + 随域变化的刻度；右上 折线生长（monotone）+ 末端点；左下 墨卡托与正射球面（内联 GeoJSON、大圆航线）；
// 右下 力导向布局展开（按迭代步插值）。颜色只为本夹具区分元素，不代表任何 skill 的建议。
import { layoutFromURL } from './runtime/layout.js';
import {
  scaleLinear, scaleBand, axisTicks, barRace, curvePoints, lineGrower, traceCurve, areaPoints,
  projection, fit, geoShapes, projectLine, greatCircle, forceLayout, fitPoints,
} from './runtime/chart.js';

const L = layoutFromURL('16x9');
const cv = document.getElementById('stage');
cv.width = L.width; cv.height = L.height;
const c = cv.getContext('2d');
const W = L.width / 2, H = L.height / 2;
const D = 8; window.DURATION = D;
const lin = (p) => p, smooth = (p) => p * p * (3 - 2 * p);

// ---- 左上：柱状图竞赛 ----
const RACE = barRace([
  { t: 0, values: { A: 90, B: 70, C: 60, D: 40, E: 30, F: 10 } },
  { t: 2, values: { A: 95, B: 100, C: 62, D: 60, E: 35, F: 30 } },
  { t: 4, values: { A: 100, B: 130, C: 64, D: 110, E: 70, F: 80 } },
  { t: 6, values: { A: 105, B: 150, C: 66, D: 160, E: 140, F: 150 } },
  { t: 8, values: { A: 110, B: 170, C: 68, D: 200, E: 230, F: 240 } },
], { top: 4, ease: lin, swap: { duration: 0.6, ease: smooth }, fade: 1 });
const HUES = { A: 0, B: 60, C: 120, D: 180, E: 240, F: 300 };
const ROWS = scaleBand({ domain: 4, range: [40, H - 40], paddingInner: 0.25, paddingOuter: 0.1 });
function paintRace(t) {
  // 出榜的条会继续往下滑（pos > top），裁到本格是调用方的事
  c.save(); c.beginPath(); c.rect(0, 0, W, H); c.clip();
  const x = scaleLinear({ domain: [0, RACE.maxAt(t)], range: [40, W - 40] });
  for (const tk of axisTicks(x, 5, { blend: 0.15, edge: 30 })) {
    c.globalAlpha = tk.alpha; c.fillStyle = '#555'; c.fillRect(tk.pos - 1, 20, 2, H - 40);
  }
  for (const it of RACE.at(t)) {
    c.globalAlpha = it.alpha; c.fillStyle = `hsl(${HUES[it.key]} 70% 55%)`;
    c.fillRect(x(0), ROWS.at(it.pos), x(it.value) - x(0), ROWS.bandwidth);
  }
  c.globalAlpha = 1; c.restore();
}

// ---- 右上：折线生长 ----
const SERIES = [3, 4, 4, 9, 14, 13, 13, 20, 26, 24, 31, 40];
const sx = scaleLinear({ domain: [0, SERIES.length - 1], range: [W + 60, 2 * W - 60] });
const sy = scaleLinear({ domain: [0, 40], range: [H - 50, 50] });
const LINE = curvePoints(SERIES.map((v, i) => [sx(i), sy(v)]), 'monotone', { samples: 12 });
const GROW = lineGrower(LINE);
function paintLine(t) {
  for (const v of [0, 10, 20, 30, 40]) { c.fillStyle = '#333'; c.fillRect(W + 60, sy(v) - 1, W - 120, 2); }
  const g = GROW.at(smooth(Math.min(1, t / 6)), 'x');
  c.fillStyle = 'rgba(80,160,255,.25)'; c.beginPath(); traceCurve(c, areaPoints(g.points, sy(0)), { close: true }); c.fill();
  c.strokeStyle = '#5af'; c.lineWidth = 5; c.beginPath(); traceCurve(c, g.points); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(g.end[0], g.end[1], 10, 0, Math.PI * 2); c.fill();
}

// ---- 左下：地图（内联 GeoJSON：一个不对称的"F"形区域 + 一条线 + 两个点）----
const F_SHAPE = { type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [[
  [0, 0], [10, 0], [10, 40], [30, 40], [30, 50], [0, 50], [0, 0]], [[3, 30], [6, 30], [6, 35], [3, 35], [3, 30]]] } };
const BAR = { type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [[[10, 20], [22, 20], [22, 28], [10, 28], [10, 20]]] } };
const RIVER = { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [[-20, -10], [0, -5], [20, -12], [40, -4]] } };
const CITIES = { type: 'Feature', properties: {}, geometry: { type: 'MultiPoint', coordinates: [[-20, -10], [40, -4]] } };
const WORLD = { type: 'FeatureCollection', features: [F_SHAPE, BAR, RIVER, CITIES] };
const MERC = fit(projection('mercator'), WORLD, [30, H + 40, W / 2 - 60, H - 80]);
const GRAT = { type: 'FeatureCollection', features: [] };
for (let lon = -180; lon < 180; lon += 30) GRAT.features.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: Array.from({ length: 19 }, (_, i) => [lon, -90 + i * 10]) } });
for (let lat = -60; lat <= 60; lat += 30) GRAT.features.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: Array.from({ length: 37 }, (_, i) => [-180 + i * 10, lat]) } });
const ROUTE = greatCircle([-20, -10], [100, 50]);
function drawShapes(shapes, fill, stroke) {
  for (const s of shapes) {
    if (s.type === 'polygon') { c.fillStyle = fill; c.beginPath(); for (const r of s.rings) traceCurve(c, r, { close: true }); c.fill('evenodd'); }
    else if (s.type === 'line') { c.strokeStyle = stroke; c.lineWidth = 3; for (const p of s.parts) { c.beginPath(); traceCurve(c, p); c.stroke(); } }
    else for (const p of s.points) if (p) { c.fillStyle = stroke; c.beginPath(); c.arc(p[0], p[1], 7, 0, Math.PI * 2); c.fill(); }
  }
}
function paintMap(t) {
  drawShapes(geoShapes(MERC, WORLD), '#c84', '#4cf');
  const R = 220, cx = W * 0.72, cy = H * 1.5;
  const ORTHO = projection('orthographic', { scale: R, translate: [cx, cy], rotate: [-15 - 120 * (t / D), -20] });
  c.fillStyle = '#123'; c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.fill();
  c.lineWidth = 1.5; c.strokeStyle = '#345';
  for (const s of geoShapes(ORTHO, GRAT, { densify: 5 })) for (const p of s.parts) { c.beginPath(); traceCurve(c, p); c.stroke(); }
  drawShapes(geoShapes(ORTHO, WORLD, { densify: 2 }), '#c84', '#4cf');
  const pts = ROUTE.points(48, smooth(Math.min(1, t / 6)));
  c.strokeStyle = '#fd4'; c.lineWidth = 4;
  for (const p of projectLine(ORTHO, pts).parts) { c.beginPath(); traceCurve(c, p); c.stroke(); }
  const head = ORTHO.project(pts[pts.length - 1]);
  if (head) { c.fillStyle = '#fd4'; c.beginPath(); c.arc(head[0], head[1], 8, 0, Math.PI * 2); c.fill(); }
}

// ---- 右下：力导向（加载期跑完；seek 按迭代步插值）----
const N = 40, NODES = Array.from({ length: N }, (_, i) => ({ id: i }));
const LINKS = []; for (let i = 1; i < N; i++) LINKS.push({ source: i, target: Math.floor((i - 1) / 3) });
LINKS.push({ source: 5, target: 30 });
const GRAPH = forceLayout(NODES, LINKS, { seed: 11, iterations: 300, distance: 30, charge: -60, record: 5 });
const GFIT = fitPoints(GRAPH.nodes, [W + 60, H + 40, W - 120, H - 80]);
function paintGraph(t) {
  const pos = GRAPH.at(300 * smooth(Math.min(1, t / 6))).map((n) => GFIT.map(n));
  c.strokeStyle = '#777'; c.lineWidth = 2;
  for (const l of LINKS) { c.beginPath(); c.moveTo(...pos[l.source]); c.lineTo(...pos[l.target]); c.stroke(); }
  for (let i = 0; i < N; i++) { c.fillStyle = i === 0 ? '#f55' : '#ddd'; c.beginPath(); c.arc(pos[i][0], pos[i][1], i === 0 ? 10 : 6, 0, Math.PI * 2); c.fill(); }
}

window.seek = (t) => {
  c.fillStyle = '#000'; c.fillRect(0, 0, L.width, L.height);
  c.fillStyle = '#111'; c.fillRect(W - 1, 0, 2, L.height); c.fillRect(0, H - 1, L.width, 2);
  paintRace(t); paintLine(t); paintMap(t); paintGraph(t);
};
</script>
